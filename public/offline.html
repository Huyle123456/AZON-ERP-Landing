<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · AZON ERP</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
        --primary: #2f5e97;
        --primary-dark: #1f3f65;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #eef3f9 0%, #ffffff 50%, #ede9fe 100%);
        color: #0f172a;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 9999px;
        background: rgba(47, 94, 151, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
        color: var(--primary-dark);
      }
      p {
        color: #64748b;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      button {
        background: var(--primary);
        color: #fff;
        border: 0;
        padding: 0.625rem 1.25rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      button:hover { background: var(--primary-dark); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M1 1l22 22"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        We can't reach AZON right now. Check your connection and try again —
        cached pages remain available.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
